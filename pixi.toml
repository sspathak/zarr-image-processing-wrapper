[workspace]
authors = ["Suraj Pathak <suraj@example.com>"]
channels = ["conda-forge"]
description = "High-performance HTTP proxy for on-the-fly volumetric filtering of Zarr v3 OME-Zarr datasets"
name = "zarr-image-processing-wrapper"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.12"
fastapi = ">=0.115"
uvicorn = ">=0.30"
zarr = ">=3.0.0"
numcodecs = ">=0.14"
s3fs = ">=2024.9"
scikit-image = ">=0.24"
scipy = ">=1.14"
numpy = ">=2.0"
cachetools = ">=5.5"
httpx = ">=0.27"
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
dask = ">=2026.8.0,<2027"

[tasks]
test = { cmd = "pytest -v tests/", env = { PYTHONPATH = "." } }
proxy = { cmd = "uvicorn zarr_proxy.server:app --host 0.0.0.0 --port 8000 --workers 16", env = { PYTHONPATH = ".", OMP_NUM_THREADS = "2", OPENBLAS_NUM_THREADS = "2" } }
proxy-dev = { cmd = "uvicorn zarr_proxy.server:app --host 0.0.0.0 --port 8000 --reload", env = { PYTHONPATH = "." } }
proxy-max = { cmd = "uvicorn zarr_proxy.server:app --host 0.0.0.0 --port 8000 --workers 32", env = { PYTHONPATH = ".", OMP_NUM_THREADS = "2", OPENBLAS_NUM_THREADS = "2" } }
